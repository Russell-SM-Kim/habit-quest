<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>폴드 펼침 · 오늘과 상태</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3E4146}a:hover{color:#1A1A1A}
</style>
</helmet>
<div style="--a: {{accent}}; position: relative; width: 884px; height: 1000px; box-sizing: border-box; background: #6F8AA3; color: #3E4146; font-family: 'Noto Sans KR', sans-serif; overflow: hidden">

<div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden">
<div style="position: absolute; left: -80px; top: -80px; width: 1040px; height: 400px; background: #4E6A86; filter: blur(60px)"></div>
<div style="position: absolute; left: 420px; top: 140px; width: 460px; height: 300px; border-radius: 230px; background: #F2E6D0; filter: blur(70px); opacity: 0.85"></div>
<div style="position: absolute; left: -60px; top: 420px; width: 460px; height: 260px; border-radius: 230px; background: #DCE3EA; filter: blur(55px); opacity: 0.9"></div>
<div style="position: absolute; left: 380px; top: 600px; width: 560px; height: 280px; border-radius: 280px; background: #C9D3DD; filter: blur(60px); opacity: 0.9"></div>
<div style="position: absolute; left: -60px; top: 820px; width: 1000px; height: 260px; background: #56677A; filter: blur(60px)"></div>
</div>

<div style="position: relative; height: 100%; display: flex">

<nav aria-label="주요 메뉴" style="width: 104px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 120px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<a href="{{n.href}}" style="{{n.link}}">
<span style="{{n.ring}}"><span style="{{n.disc}}">
<sc-if value="{{n.home}}" hint-placeholder-val="{{true}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5 2 10.5V21a1 1 0 0 0 1 1h6v-7h6v7h6a1 1 0 0 0 1-1V10.5z"></path></svg></sc-if>
<sc-if value="{{n.user}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4.5"></circle><path d="M3.5 21a8.5 8.5 0 0 1 17 0z"></path></svg></sc-if>
<sc-if value="{{n.cal}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 2h2v3H7zM15 2h2v3h-2z"></path><path d="M4 5h16a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 6v9h14v-9z"></path></svg></sc-if>
<sc-if value="{{n.cog}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10.3 2h3.4l.5 2.6 1.9.8 2.2-1.5 2.4 2.4-1.5 2.2.8 1.9 2.6.5v3.4l-2.6.5-.8 1.9 1.5 2.2-2.4 2.4-2.2-1.5-1.9.8-.5 2.6h-3.4l-.5-2.6-1.9-.8-2.2 1.5-2.4-2.4 1.5-2.2-.8-1.9L2 13.7v-3.4l2.6-.5.8-1.9-1.5-2.2 2.4-2.4 2.2 1.5 1.9-.8zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"></path></svg></sc-if>
</span></span>
<span>{{n.label}}</span>
</a>
</sc-for>
</nav>

<div style="flex: 1; min-width: 0; padding: 32px 24px 24px 4px; display: flex; flex-direction: column; gap: 14px">
<header style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<h1 style="margin: 0; font-family: 'Saira Semi Condensed', sans-serif; font-size: 48px; font-weight: 700; line-height: 1; color: #FFFFFF; text-shadow: 0 2px 10px rgba(30, 45, 60, 0.45)">Day 23<span style="font-size: 26px; font-weight: 500"> / 66</span></h1>
<span style="font-family: 'Saira Semi Condensed', sans-serif; font-size: 18px; font-weight: 600; color: #FFFFFF; text-shadow: 0 1px 6px rgba(30, 45, 60, 0.5)">초기화까지 08:12:44</span>
</div>
<div aria-hidden="true" style="height: 8px; background: rgba(255, 255, 255, 0.35); border: 1px solid rgba(255, 255, 255, 0.85)"><div style="width: 35%; height: 100%; background: rgba(255, 255, 255, 0.95)"></div></div>
</header>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start">

<div style="display: flex; flex-direction: column; gap: 12px">
<section aria-label="플레이어" style="background: rgba(246, 247, 249, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 6px 20px rgba(20, 30, 45, 0.22); clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px); padding: 12px 16px 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; border-bottom: 1.5px solid #8C9097">
<span style="font-family: 'Saira Semi Condensed', 'Noto Sans KR', sans-serif; font-size: 22px; font-weight: 600; color: #4A4D53">[이름]</span>
<span style="font-family: 'Saira Semi Condensed', sans-serif; font-size: 14px; font-weight: 600; color: #6B6F76">LV: <span style="font-size: 22px; color: #3E4146">7</span></span>
</div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 10px">
<span style="font-family: 'Saira Semi Condensed', sans-serif; font-size: 14px; font-weight: 600; color: #5A5E65; width: 30px">EXP</span>
<div aria-hidden="true" style="flex: 1; height: 10px; background: #D5D8DC; border: 1px solid #A9ADB3; transform: skewX(-25deg)"><div style="width: 62%; height: 100%; background: #8CC63F"></div></div>
<span style="font-family: 'Saira Semi Condensed', sans-serif; font-size: 15px; font-weight: 600">1240 / 2000</span>
</div>
<div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: #5A5E65">
<span>러너 · E랭크</span>
<span>23일 연속 · 보호권 2</span>
</div>
</section>

<section aria-labelledby="dq" style="background: rgba(246, 247, 249, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 6px 20px rgba(20, 30, 45, 0.22); clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px)">
<div style="padding: 12px 16px 0; text-align: center">
<h2 id="dq" style="margin: 0; padding-bottom: 8px; border-bottom: 1.5px solid #8C9097; font-family: 'Saira Semi Condensed', sans-serif; font-size: 22px; font-weight: 600; color: #4A4D53">Daily Quest</h2>
</div>
<ul style="list-style: none; margin: 0; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{quests}}" as="q" hint-placeholder-count="6">
<li style="{{q.row}}">
<span style="{{q.icon}}">
<sc-if value="{{q.done}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
<sc-if value="{{q.todo}}" hint-placeholder-val="{{false}}"><span style="font-family: 'Saira Semi Condensed', sans-serif; font-size: 11px; font-weight: 700">{{q.code}}</span></sc-if>
</span>
<div style="flex: 1; display: flex; flex-direction: column; min-width: 0">
<span style="{{q.titleStyle}}">{{q.title}}</span>
<span style="{{q.subStyle}}">{{q.sub}}</span>
</div>
<span style="{{q.rightStyle}}">{{q.right}}</span>
</li>
</sc-for>
</ul>
<div style="display: flex; justify-content: space-between; padding: 9px 16px; background: rgba(200, 204, 209, 0.6); font-size: 12px; color: #4A4D53">
<span>완료 <span style="font-family: 'Saira Semi Condensed', sans-serif; font-size: 16px; font-weight: 700">3 / 6</span></span>
<span>전부 끝내면 <span style="font-family: 'Saira Semi Condensed', sans-serif; font-size: 15px; font-weight: 700">+30 EXP</span></span>
</div>
</section>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<section aria-labelledby="ab" style="background: rgba(246, 247, 249, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 6px 20px rgba(20, 30, 45, 0.22); clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px)">
<div style="padding: 12px 16px 0; text-align: center">
<h2 id="ab" style="margin: 0; padding-bottom: 8px; border-bottom: 1.5px solid #8C9097; font-family: 'Saira Semi Condensed', sans-serif; font-size: 22px; font-weight: 600; color: #4A4D53">Ability</h2>
</div>
<ul style="list-style: none; margin: 0; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="6">
<li style="display: flex; align-items: center; gap: 12px; padding: 0 14px 0 10px; min-height: 44px; background: rgba(222, 224, 228, 0.88); border: 1px solid rgba(255, 255, 255, 0.95)">
<span style="width: 30px; height: 30px; flex-shrink: 0; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-family: 'Saira Semi Condensed', sans-serif; font-size: 11px; font-weight: 700; background: #3E4146; color: #FFFFFF; box-shadow: 0 0 0 2px rgba(255,255,255,0.9)">{{s.code}}</span>
<span style="width: 52px; font-size: 14px; font-weight: 600">{{s.label}}</span>
<div aria-hidden="true" style="flex: 1; height: 6px; background: #C9CCD1"><div style="{{s.bar}}"></div></div>
<span style="width: 30px; text-align: right; font-family: 'Saira Semi Condensed', sans-serif; font-size: 22px; font-weight: 700">{{s.value}}</span>
</li>
</sc-for>
</ul>
</section>

<section aria-labelledby="gr" style="background: rgba(246, 247, 249, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.9); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 8px">
<h2 id="gr" style="margin: 0; font-size: 14px; font-weight: 700">다음 레벨업 예상 분배</h2>
<sc-for list="{{shares}}" as="g" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 34px; font-family: 'Saira Semi Condensed', sans-serif; font-size: 14px; font-weight: 600; color: #4A4D53">{{g.code}}</span>
<div aria-hidden="true" style="flex: 1; height: 8px; background: #D5D8DC"><div style="{{g.bar}}"></div></div>
<span style="width: 38px; text-align: right; font-family: 'Saira Semi Condensed', sans-serif; font-size: 14px; font-weight: 600">{{g.pct}}%</span>
</div>
</sc-for>
</section>

<section aria-label="주간 보스" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(120, 128, 140, 0.55); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.6)">
<span style="font-family: 'Saira Semi Condensed', 'Noto Sans KR', sans-serif; font-size: 14px; font-weight: 600; color: #FFFFFF; width: 92px">미루기 슬라임</span>
<div aria-hidden="true" style="flex: 1; height: 9px; background: rgba(40, 44, 50, 0.6); border: 1px solid rgba(255, 255, 255, 0.8); transform: skewX(-25deg)"><div style="width: 40%; height: 100%; background: #E04848"></div></div>
<span style="font-family: 'Saira Semi Condensed', sans-serif; font-size: 14px; font-weight: 600; color: #FFFFFF">HP 2/5</span>
</section>
</div>

</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F0B400","options":["#F0B400","#4DA3E8","#7DC21E","#E04848"]},"$preview":{"width":884,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
var raw = [
  ['아침 물 한 잔', 'VIT · 쉬움', '1회', true, 'VIT'],
  ['7시 전 기상', 'WIL · 보통', '06:48', true, 'WIL'],
  ['맨몸 근력 서킷', 'STR · 푸시업 3×8 · 스쿼트 3×15', '', true, 'STR'],
  ['독서', 'INT · 목표 20분', '0/20분', false, 'INT'],
  ['명상', 'WIL · 목표 10분', '0/10분', false, 'WIL'],
  ['취침 1시간 전 폰 금지', 'WIL · VIT', '22:00~', false, 'WIL']
];
var focus = 3;
var quests = raw.map(function (r, i) {
  var done = r[3], sel = i === focus;
  return {
    title: r[0], sub: r[1], done: done, todo: !done, code: r[4],
    right: done ? 'Clear' : r[2],
    row: 'display: flex; align-items: center; gap: 12px; padding: 0 12px; min-height: 50px; background: ' + (sel ? 'var(--a)' : 'rgba(222, 224, 228, 0.88)') + '; border: 1px solid ' + (sel ? 'var(--a)' : 'rgba(255, 255, 255, 0.95)'),
    icon: 'width: 32px; height: 32px; flex-shrink: 0; box-sizing: border-box; border-radius: 16px; display: flex; align-items: center; justify-content: center; ' + (sel ? 'background: #FFFFFF; color: #3E4146' : 'background: #3E4146; color: #FFFFFF; box-shadow: 0 0 0 2px rgba(255,255,255,0.9)'),
    titleStyle: "font-family: 'Saira Semi Condensed', 'Noto Sans KR', sans-serif; font-size: 16px; font-weight: " + (sel ? 700 : 600) + '; color: ' + (sel ? '#FFFFFF' : (done ? '#8C9097' : '#3E4146')) + (sel ? '; text-shadow: 0 1px 2px rgba(0,0,0,0.3)' : '') + (done ? '; text-decoration: line-through' : ''),
    subStyle: 'font-size: 11px; color: ' + (sel ? '#FFFFFF' : '#6B6F76'),
    rightStyle: "font-family: 'Saira Semi Condensed', sans-serif; font-size: 15px; font-weight: 600; color: " + (sel ? '#FFFFFF' : (done ? '#8C9097' : '#3E4146'))
  };
});
var stats = [['STR', '근력', 16], ['END', '지구력', 19], ['AGI', '민첩', 15], ['INT', '지능', 14], ['WIL', '정신력', 18], ['VIT', '활력', 15]].map(function (s) {
  return { code: s[0], label: s[1], value: s[2], bar: 'width: ' + Math.round(s[2] / 20 * 100) + '%; height: 100%; background: #3E4146' };
});
var shares = [['END', 42], ['WIL', 28], ['STR', 18], ['INT', 12]].map(function (g) {
  return { code: g[0], pct: g[1], bar: 'width: ' + g[1] + '%; height: 100%; background: #5A5E65' };
});
var items = [['FoldToday.dc.html', '오늘', 'home'], ['Status.dc.html', '상태', 'user'], ['FoldRecord.dc.html', '기록', 'cal'], ['#', '설정', 'cog']];
var nav = items.map(function (it, i) {
  var on = i === 0;
  return {
    href: it[0], label: it[1], home: it[2] === 'home', user: it[2] === 'user', cal: it[2] === 'cal', cog: it[2] === 'cog',
    link: 'display: flex; flex-direction: column; align-items: center; gap: 5px; text-decoration: none; font-size: 12px; font-weight: ' + (on ? 700 : 500) + '; color: #FFFFFF; text-shadow: 0 1px 4px rgba(20,30,45,0.6)',
    ring: 'width: 66px; height: 66px; box-sizing: border-box; border-radius: 33px; border: 2px solid ' + (on ? 'var(--a)' : 'rgba(255, 255, 255, 0.85)') + '; display: flex; align-items: center; justify-content: center' + (on ? '; box-shadow: 0 0 12px var(--a)' : ''),
    disc: 'width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: var(--a); color: #FFFFFF' : 'background: rgba(228, 229, 231, 0.88); color: #6B6F76')
  };
});
return { accent: this.props.accent ?? '#F0B400', quests: quests, stats: stats, shares: shares, nav: nav };
}
}
</script>
</body>
</html>
