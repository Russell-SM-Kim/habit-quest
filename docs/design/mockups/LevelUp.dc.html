<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>레벨업 알림</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@500;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3E4146}a:hover{color:#1A1A1A}
</style>
</helmet>
<div style="position: relative; width: 412px; height: 915px; box-sizing: border-box; background: #6F8AA3; color: #3E4146; font-family: 'Noto Sans KR', sans-serif; overflow: hidden">

<div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden">
<div style="position: absolute; left: -60px; top: -60px; width: 540px; height: 360px; background: #4E6A86; filter: blur(50px)"></div>
<div style="position: absolute; left: 180px; top: 160px; width: 300px; height: 220px; border-radius: 150px; background: #F2E6D0; filter: blur(55px); opacity: 0.85"></div>
<div style="position: absolute; left: -80px; top: 380px; width: 320px; height: 200px; border-radius: 160px; background: #DCE3EA; filter: blur(45px); opacity: 0.9"></div>
<div style="position: absolute; left: 160px; top: 560px; width: 340px; height: 220px; border-radius: 170px; background: #C9D3DD; filter: blur(50px); opacity: 0.9"></div>
<div style="position: absolute; left: -40px; top: 740px; width: 520px; height: 260px; background: #56677A; filter: blur(50px)"></div>
<div style="position: absolute; inset: 0; background: rgba(150, 154, 160, 0.55)"></div>
</div>

<div style="position: relative; height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box">
<section role="dialog" aria-labelledby="lv" style="width: 340px; background: rgba(248, 248, 249, 0.96); border: 1px solid #FFFFFF; box-shadow: 0 10px 40px rgba(20, 30, 45, 0.35)">
<div style="padding: 20px 20px 14px; text-align: center">
<h1 id="lv" style="margin: 0; font-family: 'Saira Semi Condensed', sans-serif; font-size: 26px; font-weight: 700; color: #3E4146">Level Up</h1>
</div>

<div style="background: #C9CCD1; border-top: 1px solid #B4B8BE; border-bottom: 1px solid #B4B8BE; padding: 16px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<div style="display: flex; align-items: center; gap: 14px">
<span style="font-family: 'Saira Semi Condensed', sans-serif; font-size: 22px; font-weight: 600; color: #6B6F76">LV: 6</span>
<svg width="24" height="16" viewBox="0 0 24 16" fill="none" stroke="#5A5E65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8h18"></path><path d="m15 3 5 5-5 5"></path></svg>
<span style="font-family: 'Saira Semi Condensed', sans-serif; font-size: 32px; font-weight: 700; color: #3E4146">LV: 7</span>
</div>
<p style="margin: 0; font-size: 13px; color: #4A4D53; text-align: center">이번 레벨에 한 활동대로 능력치가 올랐습니다.</p>
<ul style="list-style: none; margin: 0; padding: 0; width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{gains}}" as="g" hint-placeholder-count="6">
<li style="{{g.box}}">
<span style="font-family: 'Saira Semi Condensed', sans-serif; font-size: 14px; font-weight: 600">{{g.code}}</span>
<span style="font-family: 'Saira Semi Condensed', sans-serif; font-size: 18px; font-weight: 700">+{{g.n}}</span>
</li>
</sc-for>
</ul>
<p style="margin: 0; font-size: 13px; color: #3E4146">클래스 <span style="font-weight: 700">올라운더 → 러너</span></p>
</div>

<div style="display: flex; justify-content: center; gap: 72px; padding: 22px 20px 24px">
<a href="Status.dc.html" aria-label="확인" style="width: 58px; height: 58px; box-sizing: border-box; border-radius: 29px; background: #FFFFFF; border: 3px solid #2F80D8; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(47, 128, 216, 0.35)">
<span style="width: 34px; height: 34px; box-sizing: border-box; border-radius: 17px; background: #2F80D8; display: flex; align-items: center; justify-content: center"><span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 3px solid #FFFFFF"></span></span>
</a>
<a href="Main.dc.html" aria-label="닫기" style="width: 58px; height: 58px; box-sizing: border-box; border-radius: 29px; background: #FFFFFF; border: 3px solid #D84848; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(216, 72, 72, 0.35)">
<span style="width: 34px; height: 34px; border-radius: 17px; background: #D84848; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg></span>
</a>
</div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
renderVals() {
var raw = [['STR', 2], ['END', 4], ['AGI', 1], ['INT', 1], ['WIL', 3], ['VIT', 1]];
var best = 4;
var gains = raw.map(function (g) {
  var hi = g[1] === best;
  return { code: g[0], n: g[1], box: 'display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; color: ' + (hi ? '#FFFFFF' : '#3E4146') + '; background: ' + (hi ? '#3E4146' : 'rgba(248, 248, 249, 0.9)') + '; border: 1px solid #FFFFFF' };
});
return { gains: gains };
}
}
</script>
</body>
</html>
